<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PikaCo — Custom 3D Printed Keychains & Gifts in Pakistan</title>
  <meta name="description" content="PikaCo makes personalized 3D printed keychains, name plates and custom gifts in Pakistan. Bike number plate keychains, Urdu name keychains and more. COD & advance payment available.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 560px; }
    .logo {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -1px;
    }
    .tagline {
      font-size: 1.15rem;
      color: #94a3b8;
      margin: 16px 0 32px;
      line-height: 1.6;
    }
    .badges { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 36px; }
    .badge {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .cta {
      display: inline-block;
      background: linear-gradient(90deg, #0ea5e9, #8b5cf6);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 32px;
      border-radius: 12px;
      transition: opacity 0.2s;
    }
    .cta:hover { opacity: 0.85; }
    .note { margin-top: 24px; font-size: 0.85rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">PikaCo</div>
    <p class="tagline">Custom 3D printed keychains, name plates &amp; personalized gifts — made in Pakistan, delivered to your door.</p>
    <div class="badges">
      <span class="badge">🎨 Any Name / Text</span>
      <span class="badge">🚚 COD Available</span>
      <span class="badge">💳 JazzCash / EasyPaisa</span>
      <span class="badge">📦 Nationwide Delivery</span>
    </div>
    <a class="cta" href="https://wa.me/923000000000?text=Salam%2C%20I%20want%20a%20custom%20keychain!">Order on WhatsApp</a>
    <p class="note">Full store launching soon — replace the WhatsApp number with yours.</p>
  </div>
</body>
</html>
